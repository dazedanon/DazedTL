[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dazedtl-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "Project and workflow API for the DazedTL Electron application"

[tool.setuptools.packages.find]
include = ["dazedtl*"]

[tool.setuptools.package-data]
"dazedtl.api" = ["protocol.json"]
