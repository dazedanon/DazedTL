# Formats and lints DazedTL-owned Python. The bundled engine keeps its original bytes.
target-version = "py312"
extend-exclude = ["backend/dazedtl/engine"]
force-exclude = true

[lint]
# ValueError is the API's user-facing validation error; TypeError would surface
# as an internal failure, so isinstance checks keep raising ValueError.
ignore = ["TRY004"]
