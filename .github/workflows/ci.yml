# Runs the build checks, behavior tests and previous-release QA check, then
# installs DazedTL the way a downloaded ZIP is installed and drives it through
# a translation, on Windows and Linux, updates the previous release's
# translated project to this commit and builds every test scenario. See
# "Checks", "Previous-release QA check", "Live test" and "Test scenarios" in
# docs/development.md.
#
# It runs for what lands on dev and main, for release tags, pull requests and
# once a week. Feature branches are tested before landing by scripts/land.mjs;
# run CI on one by hand with: gh workflow run CI --ref <branch>
name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so changed runner images and pinned downloads show up even
    # without new commits.
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Pushes that land on dev in quick succession share one run: the newest
# cancels the one before, and its result covers their commits too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      # Downloaded ZIPs hold the committed line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/build.mjs
      - run: node scripts/test.mjs
        env:
          # The runners are several times slower than a development machine,
          # Windows most of all; about twice their measured runtimes.
          DAZEDTL_TEST_BUDGET: ${{ runner.os == 'Windows' && 180 || 30 }}

  qa-upgrade:
    name: Previous-release QA check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # The release tags, whose code makes the QA tasks this continues.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/qa-upgrade.mjs

  live:
    name: Live test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Runs the test driver only; START gets a PATH without this Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Live test
        if: runner.os == 'Windows'
        run: node scripts/e2e.mjs --work "$env:RUNNER_TEMP\e2e"
      - name: Live test
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24"
          node scripts/e2e.mjs --work "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-test-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e/logs
          if-no-files-found: ignore

  upgrade:
    name: Upgrade test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # The previous release's tag and files.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Upgrade test
        if: runner.os == 'Windows'
        run: >-
          node scripts/e2e.mjs --upgrade-from previous
          --work "$env:RUNNER_TEMP\upgrade"
      - name: Upgrade test
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24"
          node scripts/e2e.mjs --upgrade-from previous
          --work "$RUNNER_TEMP/upgrade"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-test-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/upgrade/logs
            ${{ runner.temp }}/upgrade/previous/logs
          if-no-files-found: ignore

  scenarios:
    name: Scenarios ${{ matrix.scenarios }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        # Groups of about the same length, so the jobs end together; a
        # scenario's options follow its name.
        scenarios:
          - playtested released images-archived
          - fresh opened set-up translated qa-done paged moved-relabeled
          - assistant-led assistant-written assistant-released assistant-updated batch-waiting upgraded
          - released-ace released-mv moved images
          - update-stopped plugins-applied batch-queued qa-done --game ace
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # The previous release, which builds the upgraded scenario.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Ubuntu restricts the browser sandbox to apps with an AppArmor profile,
      # which START offers to add for an install; scenarios run the checkout.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Scenarios
        shell: bash
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          # On Linux the app needs a display; on Windows it opens on the
          # runner's desktop.
          screen() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" "$@"
            else "$@"; fi
          }
          # Each run is a scenario's name and the options after it.
          runs=()
          previous=""
          for word in $SCENARIOS; do
            if [[ $word == --* || $previous == --* ]]; then
              runs[-1]+=" $word"
            else runs+=("$word"); fi
            previous=$word
          done
          failed=""
          for index in "${!runs[@]}"; do
            run=${runs[$index]}
            # Word splitting gives the scenario its options.
            # shellcheck disable=SC2086
            screen node scripts/scenario.mjs $run \
              --work "$RUNNER_TEMP/scenarios/$index-${run%% *}" ||
              failed="$failed, $run"
          done
          if [ -n "$failed" ]; then echo "Failed: ${failed#, }"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scenarios-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/scenarios/*/logs
          if-no-files-found: ignore
